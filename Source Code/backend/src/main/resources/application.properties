# ===========================
# SmartQueue Application Config
# ===========================

spring.application.name=SmartQueue

# ---- Server ----
server.port=8080

# ---- H2 File-based Database (persists between restarts) ----
spring.datasource.url=jdbc:h2:file:./data/smartqueue;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: recreates schema on startup (use 'update' to persist data between runs)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 Web Console (accessible at /h2-console during development) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Session Cookie (cross-site: Vercel frontend + Render backend) ----
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ---- JPA Open Session in View (allows lazy loading in Thymeleaf templates) ----
spring.jpa.open-in-view=true

# ---- Logging ----
logging.level.com.smartqueue=INFO
logging.level.org.springframework.security=WARN
