<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ============================================================
     FRAGMENT: navbar
     Usage: <div th:replace="~{fragments :: navbar}"></div>
     ============================================================ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-clock-history me-2"></i>SmartQueue
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">

        <!-- Customer links -->
        <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
          <a class="nav-link" th:href="@{/customer/dashboard}"><i class="bi bi-house me-1"></i>Dashboard</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
          <a class="nav-link" th:href="@{/customer/services}"><i class="bi bi-grid me-1"></i>Services</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
          <a class="nav-link" th:href="@{/customer/appointments}"><i class="bi bi-calendar-check me-1"></i>Appointments</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
          <a class="nav-link" th:href="@{/customer/queue}"><i class="bi bi-people me-1"></i>My Queue</a>
        </li>

        <!-- Staff links -->
        <li class="nav-item" sec:authorize="hasRole('STAFF')">
          <a class="nav-link" th:href="@{/staff/dashboard}"><i class="bi bi-house me-1"></i>Dashboard</a>
        </li>

        <!-- Admin links -->
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-house me-1"></i>Dashboard</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin/services}"><i class="bi bi-gear me-1"></i>Services</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin/staff}"><i class="bi bi-people me-1"></i>Staff</a>
        </li>
      </ul>

      <!-- Right side: user info + logout -->
      <ul class="navbar-nav" sec:authorize="isAuthenticated()">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i>
            <span sec:authentication="name"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item text-danger" th:href="@{/logout}">
              <i class="bi bi-box-arrow-right me-1"></i>Logout
            </a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ============================================================
     FRAGMENT: flash messages
     ============================================================ -->
<div th:fragment="flash" class="container mt-3">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i>[[${success}]]
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-circle me-2"></i>[[${error}]]
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${info}" class="alert alert-info alert-dismissible fade show" role="alert">
    <i class="bi bi-info-circle me-2"></i>[[${info}]]
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i>[[${warning}]]
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

<!-- ============================================================
     FRAGMENT: footer
     ============================================================ -->
<footer th:fragment="footer" class="bg-light border-top mt-5 py-3">
  <div class="container text-center text-muted small">
    SmartQueue &copy; 2026 &mdash; Appointment &amp; Queue Management System &mdash; CSCI 6234
  </div>
</footer>

<!-- ============================================================
     FRAGMENT: scripts
     ============================================================ -->
<div th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
