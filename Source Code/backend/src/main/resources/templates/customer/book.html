<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Appointment – SmartQueue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container mt-4" style="max-width:560px">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">
        <i class="bi bi-calendar-plus me-2"></i>Book Appointment
      </h5>
    </div>
    <div class="card-body p-4">

      <!-- Service summary -->
      <div class="alert alert-light border mb-4 d-flex align-items-center gap-3">
        <i class="bi bi-hospital text-primary fs-3"></i>
        <div>
          <div class="fw-bold" th:text="${service.serviceName}">Service</div>
          <div class="text-muted small" th:text="${service.description}">Description</div>
          <div class="text-muted small"><i class="bi bi-clock me-1"></i><span th:text="${service.duration}">30</span> minutes</div>
        </div>
      </div>

      <form th:action="@{/customer/book}" method="post">
        <input type="hidden" name="serviceId" th:value="${service.id}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mb-3">
          <label class="form-label fw-semibold">Select Date</label>
          <input type="date" name="date" class="form-control"
                 th:min="${today}" required>
          <div class="form-text">Choose a date from today onwards.</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Select Time Slot</label>
          <select name="timeSlot" class="form-select" required>
            <option value="">-- Choose a time --</option>
            <option value="08:00">08:00 AM</option>
            <option value="08:30">08:30 AM</option>
            <option value="09:00">09:00 AM</option>
            <option value="09:30">09:30 AM</option>
            <option value="10:00">10:00 AM</option>
            <option value="10:30">10:30 AM</option>
            <option value="11:00">11:00 AM</option>
            <option value="11:30">11:30 AM</option>
            <option value="12:00">12:00 PM</option>
            <option value="13:00">01:00 PM</option>
            <option value="13:30">01:30 PM</option>
            <option value="14:00">02:00 PM</option>
            <option value="14:30">02:30 PM</option>
            <option value="15:00">03:00 PM</option>
            <option value="15:30">03:30 PM</option>
            <option value="16:00">04:00 PM</option>
            <option value="16:30">04:30 PM</option>
          </select>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary py-2 fw-semibold">
            <i class="bi bi-calendar-check me-2"></i>Confirm Booking
          </button>
          <a th:href="@{/customer/services}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Back to Services
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
