<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Appointments – SmartQueue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-calendar-check me-2 text-primary"></i>My Appointments</h2>
    <a th:href="@{/customer/services}" class="btn btn-primary btn-sm">
      <i class="bi bi-plus me-1"></i>Book New
    </a>
  </div>

  <div class="table-responsive" th:if="${!#lists.isEmpty(appointments)}">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Service</th>
          <th>Date</th>
          <th>Time</th>
          <th>Status</th>
          <th>Booked On</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="appt : ${appointments}">
          <td>
            <div class="fw-semibold" th:text="${appt.service.serviceName}">Service</div>
            <div class="text-muted small" th:text="${appt.service.description}">Desc</div>
          </td>
          <td th:text="${#temporals.format(appt.date, 'MMM d, yyyy')}">Date</td>
          <td th:text="${#temporals.format(appt.timeSlot, 'hh:mm a')}">Time</td>
          <td>
            <span th:class="${'badge ' +
              (appt.status.name() == 'CONFIRMED'  ? 'bg-success' :
               appt.status.name() == 'CANCELLED'  ? 'bg-danger'  :
               appt.status.name() == 'COMPLETED'  ? 'bg-secondary' :
               'bg-warning')}"
                  th:text="${appt.status}">STATUS</span>
          </td>
          <td th:text="${#temporals.format(appt.createdAt, 'MMM d, yyyy')}">Created</td>
          <td>
            <form th:if="${appt.status.name() == 'CONFIRMED'}"
                  th:action="@{/customer/cancel/{id}(id=${appt.id})}" method="post"
                  onsubmit="return confirm('Cancel this appointment?')">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn btn-outline-danger btn-sm">
                <i class="bi bi-x-circle me-1"></i>Cancel
              </button>
            </form>
            <span class="text-muted small" th:if="${appt.status.name() != 'CONFIRMED'}">—</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="alert alert-info" th:if="${#lists.isEmpty(appointments)}">
    <i class="bi bi-info-circle me-2"></i>You have no appointments yet.
    <a th:href="@{/customer/services}" class="alert-link">Book one now.</a>
  </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
