<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Queue – SmartQueue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <!-- Auto-refresh every 30 seconds to update position -->
  <meta http-equiv="refresh" content="30">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container mt-4">
  <h2 class="mb-4"><i class="bi bi-people me-2 text-success"></i>Virtual Queue</h2>

  <div class="row g-4">
    <!-- Join a queue -->
    <div class="col-md-5">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-success text-white">
          <h6 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Join a Queue</h6>
        </div>
        <div class="card-body">
          <form th:action="@{/customer/queue/join}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
              <label class="form-label fw-semibold">Select Service</label>
              <select name="serviceId" class="form-select" required>
                <option value="">-- Choose a service --</option>
                <option th:each="s : ${services}"
                        th:value="${s.id}"
                        th:text="${s.serviceName} + ' (' + ${s.duration} + ' min)'">
                </option>
              </select>
            </div>
            <button type="submit" class="btn btn-success w-100">
              <i class="bi bi-people me-2"></i>Join Queue
            </button>
          </form>
          <div class="form-text mt-2 text-center">
            <i class="bi bi-arrow-repeat me-1"></i>Page auto-refreshes every 30 seconds
          </div>
        </div>
      </div>
    </div>

    <!-- Active queue entries -->
    <div class="col-md-7">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-light">
          <h6 class="mb-0"><i class="bi bi-list-ol me-2"></i>My Queue Status</h6>
        </div>
        <div class="card-body p-0">
          <div th:if="${!#lists.isEmpty(myEntries)}">
            <div th:each="entry : ${myEntries}" class="p-3 border-bottom">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <div class="fw-bold" th:text="${entry.queue.service.serviceName}">Service</div>
                  <div class="text-muted small">
                    Queue #<span th:text="${entry.queueNumber}">1</span>
                    &bull; Joined <span th:text="${#temporals.format(entry.joinedAt, 'hh:mm a')}">10:00</span>
                  </div>
                </div>
                <div class="text-end">
                  <span th:class="${'badge fs-6 ' +
                    (entry.status.name() == 'WAITING'    ? 'bg-warning text-dark' :
                     entry.status.name() == 'CALLED'     ? 'bg-primary' :
                     entry.status.name() == 'IN_SERVICE' ? 'bg-success' :
                     entry.status.name() == 'COMPLETED'  ? 'bg-secondary' :
                     'bg-danger')}"
                       th:text="${entry.status}">STATUS</span>
                  <div class="text-muted small mt-1"
                       th:if="${entry.status.name() == 'WAITING'}">
                    Position: <strong th:text="${entry.position}">1</strong>
                  </div>
                  <div class="text-success small fw-bold mt-1"
                       th:if="${entry.status.name() == 'CALLED' or entry.status.name() == 'IN_SERVICE'}">
                    Please proceed to the counter!
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="p-3 text-muted text-center" th:if="${#lists.isEmpty(myEntries)}">
            <i class="bi bi-inbox fs-2 d-block mb-2"></i>
            You are not in any queue. Join one above!
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
