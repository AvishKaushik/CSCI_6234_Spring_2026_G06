<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services – SmartQueue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container mt-4">
  <h2 class="mb-4"><i class="bi bi-grid me-2 text-primary"></i>Available Services</h2>

  <div class="row g-4">
    <div class="col-md-6 col-lg-4" th:each="service : ${services}">
      <div class="card h-100 border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <div class="icon-circle bg-primary-subtle me-3">
              <i class="bi bi-hospital text-primary fs-4"></i>
            </div>
            <h5 class="card-title mb-0" th:text="${service.serviceName}">Service</h5>
          </div>
          <p class="card-text text-muted small" th:text="${service.description}">Description</p>
          <div class="d-flex align-items-center text-muted small mb-3">
            <i class="bi bi-clock me-1"></i>
            <span th:text="${service.duration} + ' minutes'">30 minutes</span>
          </div>
          <div class="d-grid gap-2">
            <a th:href="@{/customer/book/{id}(id=${service.id})}" class="btn btn-primary btn-sm">
              <i class="bi bi-calendar-plus me-1"></i>Book Appointment
            </a>
            <form th:action="@{/customer/queue/join}" method="post">
              <input type="hidden" name="serviceId" th:value="${service.id}">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button type="submit" class="btn btn-outline-success btn-sm w-100">
                <i class="bi bi-people me-1"></i>Join Queue Now
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12" th:if="${#lists.isEmpty(services)}">
      <div class="alert alert-info">No services are currently available.</div>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
