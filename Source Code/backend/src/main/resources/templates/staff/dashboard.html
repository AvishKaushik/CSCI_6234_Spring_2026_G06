<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Dashboard – SmartQueue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container mt-4">
  <h2 class="mb-1"><i class="bi bi-person-badge me-2 text-primary"></i>Staff Dashboard</h2>
  <p class="text-muted mb-4">Select a service queue to manage.</p>

  <div class="row g-4">
    <div class="col-md-4 col-lg-3" th:each="service : ${services}">
      <div class="card h-100 border-0 shadow-sm hover-card">
        <div class="card-body text-center p-4">
          <div class="icon-circle bg-primary-subtle mb-3 mx-auto">
            <i class="bi bi-hospital text-primary fs-3"></i>
          </div>
          <h6 class="card-title fw-bold" th:text="${service.serviceName}">Service</h6>
          <p class="text-muted small" th:text="${service.duration} + ' min per session'">30 min</p>
          <a th:href="@{/staff/queue/{id}(id=${service.id})}"
             class="btn btn-primary btn-sm w-100">
            <i class="bi bi-list-ol me-1"></i>Manage Queue
          </a>
        </div>
      </div>
    </div>

    <div class="col-12" th:if="${#lists.isEmpty(services)}">
      <div class="alert alert-info">No services are currently available.</div>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
