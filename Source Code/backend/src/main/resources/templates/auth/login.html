<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – SmartQueue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg" style="min-width:380px; max-width:420px; width:100%">
    <div class="card-header bg-primary text-white text-center py-4">
      <h3 class="mb-0"><i class="bi bi-clock-history me-2"></i>SmartQueue</h3>
      <small class="opacity-75">Appointment &amp; Queue Management</small>
    </div>
    <div class="card-body p-4">

      <!-- Flash messages -->
      <div th:if="${success}" class="alert alert-success py-2">
        <i class="bi bi-check-circle me-1"></i>[[${success}]]
      </div>
      <div th:if="${error}" class="alert alert-danger py-2">
        <i class="bi bi-exclamation-circle me-1"></i>[[${error}]]
      </div>
      <div th:if="${logout}" class="alert alert-info py-2">
        <i class="bi bi-box-arrow-right me-1"></i>[[${logout}]]
      </div>

      <!-- Login form — Spring Security processes POST /login -->
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="username" class="form-control"
                   placeholder="you@example.com" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control"
                   placeholder="••••••••" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <hr>
      <p class="text-center text-muted mb-0">
        New customer?
        <a th:href="@{/register}" class="fw-semibold">Create an account</a>
      </p>

      <!-- Demo credentials hint -->
      <div class="mt-3 p-3 bg-light rounded border small">
        <strong>Demo accounts:</strong><br>
        Admin: <code>admin@smartqueue.com</code> / <code>admin123</code><br>
        Staff: <code>smith@smartqueue.com</code> / <code>staff123</code><br>
        Customer: <code>alice@demo.com</code> / <code>customer123</code>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
