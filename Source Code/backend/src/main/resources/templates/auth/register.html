<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register – SmartQueue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
  <div class="card shadow-lg" style="min-width:400px; max-width:460px; width:100%">
    <div class="card-header bg-success text-white text-center py-4">
      <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i>Create Account</h4>
      <small class="opacity-75">Register as a Customer</small>
    </div>
    <div class="card-body p-4">

      <div th:if="${passwordError}" class="alert alert-danger py-2">[[${passwordError}]]</div>
      <div th:if="${emailError}"    class="alert alert-danger py-2">[[${emailError}]]</div>

      <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" th:field="*{name}" class="form-control"
                 th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="Jane Doe" required>
          <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Email address</label>
          <input type="email" th:field="*{email}" class="form-control"
                 th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="you@example.com" required>
          <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Phone Number</label>
          <input type="tel" th:field="*{phoneNumber}" class="form-control"
                 th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'" placeholder="555-0100" required>
          <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" th:field="*{password}" class="form-control"
                 th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Min. 6 characters" required>
          <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Confirm Password</label>
          <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Repeat password" required>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
          <i class="bi bi-person-check me-2"></i>Register
        </button>
      </form>

      <hr>
      <p class="text-center text-muted mb-0">
        Already have an account? <a th:href="@{/login}" class="fw-semibold">Sign in</a>
      </p>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
