<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Staff – SmartQueue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-people me-2 text-success"></i>Manage Staff</h2>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addStaffModal">
      <i class="bi bi-person-plus me-1"></i>Add Staff
    </button>
  </div>

  <!-- Staff table -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive" th:if="${!#lists.isEmpty(staffList)}">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="staff : ${staffList}">
              <td>
                <div class="d-flex align-items-center gap-2">
                  <div class="icon-circle-sm bg-success-subtle">
                    <i class="bi bi-person text-success"></i>
                  </div>
                  <span class="fw-semibold" th:text="${staff.name}">Name</span>
                </div>
              </td>
              <td th:text="${staff.email}">email</td>
              <td>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-primary btn-sm"
                          data-bs-toggle="modal" data-bs-target="#editStaffModal"
                          th:attr="data-id=${staff.id}, data-name=${staff.name}, data-email=${staff.email}"
                          onclick="fillStaffEdit(this)">
                    <i class="bi bi-pencil me-1"></i>Edit
                  </button>
                  <form th:action="@{/admin/staff/delete/{id}(id=${staff.id})}" method="post"
                        onsubmit="return confirm('Delete this staff account?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-outline-danger btn-sm">
                      <i class="bi bi-trash me-1"></i>Delete
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="p-4 text-center text-muted" th:if="${#lists.isEmpty(staffList)}">
        <i class="bi bi-inbox fs-2 d-block mb-2"></i>No staff accounts yet.
      </div>
    </div>
  </div>
</div>

<!-- Add Staff Modal -->
<div class="modal fade" id="addStaffModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Add Staff Account</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form th:action="@{/admin/staff/create}" th:object="${form}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" th:field="*{name}" class="form-control" required placeholder="Dr. Jane Doe">
            <div class="text-danger small" th:errors="*{name}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" th:field="*{email}" class="form-control" required placeholder="staff@example.com">
            <div class="text-danger small" th:errors="*{email}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" th:field="*{password}" class="form-control" required placeholder="Min. 6 chars">
            <div class="text-danger small" th:errors="*{password}"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success"><i class="bi bi-check me-1"></i>Create Account</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Edit Staff Modal -->
<div class="modal fade" id="editStaffModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>Edit Staff</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="editStaffForm" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" id="sName" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" id="sEmail" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">New Password <span class="text-muted small">(leave blank to keep current)</span></label>
            <input type="password" id="sPassword" name="password" class="form-control" placeholder="Optional">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-warning"><i class="bi bi-check me-1"></i>Update</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
<script>
function fillStaffEdit(btn) {
  document.getElementById('sName').value  = btn.dataset.name;
  document.getElementById('sEmail').value = btn.dataset.email;
  document.getElementById('sPassword').value = '';
  document.getElementById('editStaffForm').action = '/admin/staff/update/' + btn.dataset.id;
}
</script>
</body>
</html>
