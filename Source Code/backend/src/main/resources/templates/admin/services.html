<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Services – SmartQueue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: flash}"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-gear me-2 text-primary"></i>Manage Services</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addServiceModal">
      <i class="bi bi-plus me-1"></i>Add Service
    </button>
  </div>

  <!-- Services table -->
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive" th:if="${!#lists.isEmpty(services)}">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Service Name</th>
              <th>Description</th>
              <th>Duration</th>
              <th>Available</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="svc : ${services}">
              <td class="fw-semibold" th:text="${svc.serviceName}">Name</td>
              <td class="text-muted small" th:text="${svc.description}">Desc</td>
              <td><span class="badge bg-light text-dark border" th:text="${svc.duration} + ' min'">30 min</span></td>
              <td>
                <span class="badge" th:class="${svc.available ? 'bg-success' : 'bg-secondary'}"
                      th:text="${svc.available ? 'Active' : 'Inactive'}">Active</span>
              </td>
              <td>
                <div class="d-flex gap-2">
                  <!-- Edit button triggers modal -->
                  <button class="btn btn-outline-primary btn-sm"
                          data-bs-toggle="modal"
                          th:attr="data-bs-target='#editModal' + ${svc.id},
                                   data-id=${svc.id},
                                   data-name=${svc.serviceName},
                                   data-desc=${svc.description},
                                   data-dur=${svc.duration},
                                   data-avail=${svc.available}"
                          onclick="fillEditModal(this)">
                    <i class="bi bi-pencil me-1"></i>Edit
                  </button>
                  <form th:action="@{/admin/services/delete/{id}(id=${svc.id})}" method="post"
                        onsubmit="return confirm('Delete this service?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-outline-danger btn-sm">
                      <i class="bi bi-trash me-1"></i>Delete
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="p-4 text-center text-muted" th:if="${#lists.isEmpty(services)}">
        <i class="bi bi-inbox fs-2 d-block mb-2"></i>No services yet. Add one above.
      </div>
    </div>
  </div>
</div>

<!-- Add Service Modal -->
<div class="modal fade" id="addServiceModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Add New Service</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form th:action="@{/admin/services/create}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Service Name</label>
            <input type="text" name="serviceName" class="form-control" required placeholder="e.g. General Consultation">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="2" placeholder="Brief description"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Duration (minutes)</label>
            <input type="number" name="duration" class="form-control" value="30" min="5" max="240" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check me-1"></i>Create</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Edit Service Modal (single, populated by JS) -->
<div class="modal fade" id="editServiceModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>Edit Service</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="editServiceForm" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Service Name</label>
            <input type="text" id="editName" name="serviceName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea id="editDesc" name="description" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Duration (minutes)</label>
            <input type="number" id="editDur" name="duration" class="form-control" min="5" max="240" required>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="editAvail" name="isAvailable" value="true">
            <label class="form-check-label" for="editAvail">Service is Active</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-warning"><i class="bi bi-check me-1"></i>Update</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: scripts}"></div>
<script>
function fillEditModal(btn) {
  document.getElementById('editName').value  = btn.dataset.name;
  document.getElementById('editDesc').value  = btn.dataset.desc;
  document.getElementById('editDur').value   = btn.dataset.dur;
  document.getElementById('editAvail').checked = btn.dataset.avail === 'true';
  document.getElementById('editServiceForm').action = '/admin/services/update/' + btn.dataset.id;
  new bootstrap.Modal(document.getElementById('editServiceModal')).show();
}
</script>
</body>
</html>
